
name: FastAPI Tests

on:
  push:
    branches: [main, feature/api-auth-testing]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          API_KEY_USER1: test-user-one
          API_KEY_USER2: test-user-two
          DATABASE_PATH: test_usage.db
        run: |
          pytest -v --cov=app --cov-fail-under=80
